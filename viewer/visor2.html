<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 2 - KidZania - Adidas (Screen 3 y 4)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Adineue Pro', 'Helvetica', sans-serif;
            background: #000;
        }

        .visor-container {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: min(100vw, 100vh, 1080px);
            height: auto;
            aspect-ratio: 1 / 1;
            /* margin: 0 auto; */
            gap: 0;
        }

        .visor-section {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .visor-section iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .section-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="visor-container">
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 3</div> -->
            <iframe src="index.html?screen=3" allowfullscreen></iframe>
        </div>
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 4</div> -->
            <iframe src="index.html?screen=4" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
