<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Multi-Pantalla - KidZania - Adidas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Adineue Pro', 'Helvetica', sans-serif;
        }

        .visor-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
        }

        .visor-section {
            flex: 1;
            flex-direction: column;
            height: 100%;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
        }

        .visor-section:last-child {
            border-right: none;
        }

        .visor-section iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .section-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="visor-container">
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 1</div> -->
            <iframe src="index.html?screen=1" allowfullscreen></iframe>
            <iframe src="index.html?screen=2" allowfullscreen></iframe>
        </div>
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 2</div> -->
            <iframe src="index.html?screen=2" allowfullscreen></iframe>
        </div>
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 3</div> -->
            <iframe src="index.html?screen=3" allowfullscreen></iframe>
        </div>
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 1</div> -->
            <iframe src="index.html?screen=4" allowfullscreen></iframe>
        </div>
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 2</div> -->
            <iframe src="index.html?screen=5" allowfullscreen></iframe>
        </div>
        <div class="visor-section">
            <!-- <div class="section-label">Pantalla 3</div> -->
            <iframe src="index.html?screen=6" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
