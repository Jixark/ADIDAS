    <script>
        (function () {
            'use strict';

            /*
             * ======================================================
             * CONFIGURACIÓN GLOBAL DE LA API KIDZANIA
             * ======================================================
             *
             * La IP se obtiene automáticamente de la URL con la que
             * se abrió esta página.
             *
             * Ejemplo:
             *   Página: http://192.168.1.66:5500/index.htm?tablet_id=1
             *   API:    http://192.168.1.66:4000
             *
             * Se utiliza HTTP de forma intencional.
             */


            // var hostname =
            //     window.location.hostname ||
            //     '192.168.1.66';

            // window.KIDZANIA_API_BASE =
            //     'http://' + hostname + ':4000';

            //window.KIDZANIA_API_BASE ='https://api-tour.multimediacorp.com.mx';
            //window.KIDZANIA_API_BASE = 'http://localhost:4000';
            
            var hostname = window.location.hostname;
			window.KIDZANIA_API_BASE = 'http://' + hostname + ':4000';

            /*
             * Construye una URL completa de la API.
             *
             * Ejemplos:
             *   window.kidzaniaApi('/sessions')
             *   window.kidzaniaApi('/sessions/close')
             *   window.kidzaniaApi('/customise')
             */
            window.kidzaniaApi = function (ruta) {
                ruta = String(ruta || '');

                if (ruta.charAt(0) !== '/') {
                    ruta = '/' + ruta;
                }

                return window.KIDZANIA_API_BASE + ruta;
            };

            /*
             * Respaldo para acciones antiguas de 3DVista que todavía
             * tengan localhost o 127.0.0.1 escritos directamente.
             *
             * Cualquier fetch a:
             *   http://localhost:4000/...
             *   http://127.0.0.1:4000/...
             *
             * se redirige automáticamente al hostname actual.
             */
            if (!window.__KIDZANIA_FETCH_INTERCEPTADO__) {
                window.__KIDZANIA_FETCH_INTERCEPTADO__ = true;

                var fetchOriginal =
                    window.fetch.bind(window);

                function obtenerTipoOperacionApi(url) {
                    if (/\/customise(?:\?|$)/i.test(url)) {
                        return 'display';
                    }

                    if (/\/sessions\/close(?:\?|$)/i.test(url)) {
                        return 'cierre';
                    }

                    if (/\/sessions(?:\?|$)/i.test(url)) {
                        return 'inicio';
                    }

                    return 'general';
                }

                function avisarFalloApi(tipo) {
                    if (
                        typeof window.mostrarAlertaConexionApi ===
                        'function'
                    ) {
                        window.mostrarAlertaConexionApi(tipo);
                    }
                }

                window.fetch = function (recurso, opciones) {
                    var recursoFinal = recurso;
                    var urlFinal = '';

                    if (typeof recurso === 'string') {
                        recursoFinal = recurso
                            .replace(
                                /^https?:\/\/localhost:4000(?=\/|$)/i,
                                window.KIDZANIA_API_BASE
                            )
                            .replace(
                                /^https?:\/\/127\.0\.0\.1:4000(?=\/|$)/i,
                                window.KIDZANIA_API_BASE
                            );

                        urlFinal = recursoFinal;

                        if (recursoFinal !== recurso) {
                            console.log(
                                'API redirigida:',
                                recurso,
                                '→',
                                recursoFinal
                            );
                        }
                    } else if (recurso && recurso.url) {
                        urlFinal = recurso.url;
                    }

                    var esPeticionKidzania =
                        urlFinal.indexOf(
                            window.KIDZANIA_API_BASE
                        ) === 0;

                    var tipoOperacion =
                        obtenerTipoOperacionApi(urlFinal);

                    var opcionesFinales =
                        Object.assign({}, opciones || {});

                    var controlador = null;
                    var temporizador = null;

                    /*
                     * Las acciones generadas dentro de 3DVista, como
                     * /customise, no usan el helper del index. Por eso el
                     * interceptor añade también un límite de espera.
                     * Si la llamada ya trae una signal, respeta la existente.
                     */
                    if (
                        esPeticionKidzania &&
                        !opcionesFinales.signal &&
                        typeof window.AbortController === 'function'
                    ) {
                        controlador =
                            new window.AbortController();

                        opcionesFinales.signal =
                            controlador.signal;

                        temporizador =
                            setTimeout(
                                function () {
                                    controlador.abort();
                                },
                                window.KIDZANIA_API_TIMEOUT_MS ||
                                    8000
                            );
                    }

                    return fetchOriginal(
                        recursoFinal,
                        opcionesFinales
                    )
                    .then(function (response) {
                        if (temporizador) {
                            clearTimeout(temporizador);
                        }

                        /*
                         * fetch no rechaza automáticamente los HTTP 4xx/5xx.
                         * Se muestra el aviso aquí y el código original puede
                         * seguir procesando o lanzar su propio error.
                         */
                        if (
                            esPeticionKidzania &&
                            !response.ok
                        ) {
                            avisarFalloApi(tipoOperacion);
                        }

                        return response;
                    })
                    .catch(function (error) {
                        if (temporizador) {
                            clearTimeout(temporizador);
                        }

                        if (esPeticionKidzania) {
                            avisarFalloApi(tipoOperacion);
                        }

                        throw error;
                    });
                };
            }

            console.log(
                'API KidZania configurada:',
                window.KIDZANIA_API_BASE
            );
        })();
    </script>

        (function () {
            'use strict';

            var uiLayer =
                document.getElementById('ui-layer');

            var nombreForm =
                document.getElementById('nombreForm');

            var miInput =
                document.getElementById('miInput');

            var temporizadorFormulario = null;
            var temporizadoresEnfoque = [];
            var temporizadorProcesamiento = null;
            var observadorPreloader = null;
            var formularioNombreActivo = false;
            var procesandoEntrada = false;
            var operacionEntradaActual = 0;

            window.KIDZANIA_API_TIMEOUT_MS = 8000;
            window.KIDZANIA_INPUT_TIMEOUT_MS = 12000;

            /*
             * Muestra un aviso visible cuando la API no está disponible.
             * El pequeño bloqueo evita alertas duplicadas si varias promesas
             * fallan prácticamente al mismo tiempo.
             */
            var ultimaAlertaApi = 0;

            window.mostrarAlertaConexionApi =
                function (tipoOperacion) {
                    var ahora = Date.now();

                    if (
                        ahora - ultimaAlertaApi < 2000
                    ) {
                        return;
                    }

                    ultimaAlertaApi = ahora;

                    var mensaje =
                        'No hay conexión con la API. ' +
                        'Verifica que el servicio esté encendido ' +
                        'y vuelve a intentarlo.';

                    if (tipoOperacion === 'display') {
                        mensaje =
                            'No hay conexión con la API. ' +
                            'La personalización no se envió al display. ' +
                            'Verifica el servicio y vuelve a intentarlo.';
                    } else if (tipoOperacion === 'cierre') {
                        mensaje =
                            'No hay conexión con la API. ' +
                            'No fue posible cerrar la sesión en el servidor. ' +
                            'Verifica el servicio y vuelve a intentarlo.';
                    } else if (tipoOperacion === 'inicio') {
                        mensaje =
                            'No hay conexión con la API. ' +
                            'No fue posible iniciar o recuperar la sesión. ' +
                            'Verifica el servicio y vuelve a intentarlo.';
                    }

                    window.alert(mensaje);
                };

            /*
             * ======================================================
             * CONFIGURACIÓN GENERAL
             * ======================================================
             */

            window.kidzaniaLogoClickStep = 0;
            window.kidzaniaLogoResetTimer = null;
            window.KIDZANIA_CODIGO_CIERRE = '1234';

            window.kidzaniaConfig =
                window.kidzaniaConfig || {
                    tablet_id:
                        localStorage.getItem('tablet_id') ||
                        '00',

                    screen:
                        localStorage.getItem('screen') ||
                        '00',

                    round_id:
                        localStorage.getItem('round_id') ||
                        '20260709_001',

                    user_name:
                        localStorage.getItem('user_name') ||
                        'invitado',

                    line_id: '',
                    product_type: '',
                    product_id: '',

                    personalization: [
                        'var_color_blanco',
                        'var_color_detalles_blanco',
                        'var_emb_no',
                        'var_texture_no'
                    ]
                };

            /*
             * ======================================================
             * SESIÓN ACTIVA COMPARTIDA ENTRE TABLETS
             * ======================================================
             *
             * Flujo:
             * 1. Consulta GET /sessions.
             * 2. Si existe una sesión active, reutiliza su id.
             * 3. Solo si no existe, ejecuta POST /sessions.
             * 4. Si el POST llega vacío porque otra tablet creó la
             *    sesión al mismo tiempo, vuelve a consultar GET.
             */

            window.KIDZANIA_API_URL =
                window.KIDZANIA_API_BASE;

            /*
             * Evita que una petición de la API quede pendiente para siempre.
             * Se usa únicamente en las llamadas de KidZania del index y no
             * modifica las solicitudes internas del reproductor de 3DVista.
             */
            window.kidzaniaFetchConTimeout =
                function (
                    recurso,
                    opciones,
                    tiempoLimite
                ) {
                    var limite =
                        typeof tiempoLimite === 'number'
                            ? tiempoLimite
                            : window.KIDZANIA_API_TIMEOUT_MS;

                    var opcionesFinales =
                        Object.assign(
                            {},
                            opciones || {}
                        );

                    if (
                        typeof window.AbortController ===
                        'function'
                    ) {
                        var controlador =
                            new window.AbortController();

                        opcionesFinales.signal =
                            controlador.signal;

                        var temporizador =
                            setTimeout(
                                function () {
                                    controlador.abort();
                                },
                                limite
                            );

                        return window
                            .fetch(
                                recurso,
                                opcionesFinales
                            )
                            .catch(function (error) {
                                if (
                                    error &&
                                    error.name ===
                                        'AbortError'
                                ) {
                                    throw new Error(
                                        'La API no respondió dentro del tiempo esperado.'
                                    );
                                }

                                throw error;
                            })
                            .finally(function () {
                                clearTimeout(
                                    temporizador
                                );
                            });
                    }

                    /*
                     * Respaldo para navegadores sin AbortController.
                     */
                    return new Promise(
                        function (resolve, reject) {
                            var finalizada = false;

                            var temporizador =
                                setTimeout(
                                    function () {
                                        if (finalizada) {
                                            return;
                                        }

                                        finalizada = true;

                                        reject(
                                            new Error(
                                                'La API no respondió dentro del tiempo esperado.'
                                            )
                                        );
                                    },
                                    limite
                                );

                            window
                                .fetch(
                                    recurso,
                                    opcionesFinales
                                )
                                .then(function (response) {
                                    if (finalizada) {
                                        return;
                                    }

                                    finalizada = true;

                                    clearTimeout(
                                        temporizador
                                    );

                                    resolve(response);
                                })
                                .catch(function (error) {
                                    if (finalizada) {
                                        return;
                                    }

                                    finalizada = true;

                                    clearTimeout(
                                        temporizador
                                    );

                                    reject(error);
                                });
                        }
                    );
                };

            window.kidzaniaSessionPromise = null;

            window.aplicarSesionKidzania =
                function (sesion) {
                    if (!sesion || !sesion.id) {
                        throw new Error(
                            'La sesión recibida no contiene un ID.'
                        );
                    }

                    localStorage.setItem(
                        'session_id',
                        sesion.id
                    );

                    window.kidzaniaConfig =
                        window.kidzaniaConfig || {};

                    window.kidzaniaConfig.session_id =
                        sesion.id;

                    console.log(
                        'Sesión activa asignada:',
                        sesion.id
                    );

                    return sesion;
                };

            window.buscarSesionActivaKidzania =
                function () {
                    return window
                        .kidzaniaFetchConTimeout(
                            window.KIDZANIA_API_URL +
                                '/sessions',
                            {
                                method: 'GET',
                                headers: {
                                    'Accept':
                                        'application/json'
                                }
                            },
                            window.KIDZANIA_API_TIMEOUT_MS
                        )
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error(
                                'Error consultando sesiones: ' +
                                response.status
                            );
                        }

                        return response.json();
                    })
                    .then(function (sesiones) {
                        if (!Array.isArray(sesiones)) {
                            return null;
                        }

                        var activas =
                            sesiones.filter(
                                function (sesion) {
                                    return (
                                        sesion &&
                                        String(
                                            sesion.status || ''
                                        ).toLowerCase() ===
                                            'active'
                                    );
                                }
                            );

                        if (!activas.length) {
                            return null;
                        }

                        if (activas.length > 1) {
                            console.warn(
                                'Se encontraron varias sesiones activas:',
                                activas
                            );
                        }

                        /*
                         * Si por una condición de carrera hubiera
                         * varias activas, usa la más reciente.
                         */
                        activas.sort(
                            function (a, b) {
                                var fechaA =
                                    new Date(
                                        a.session_start || 0
                                    ).getTime() || 0;

                                var fechaB =
                                    new Date(
                                        b.session_start || 0
                                    ).getTime() || 0;

                                return fechaB - fechaA;
                            }
                        );

                        return activas[0];
                    });
                };

            window.leerRespuestaSeguraKidzania =
                function (response) {
                    if (!response.ok) {
                        throw new Error(
                            'Error HTTP: ' +
                            response.status
                        );
                    }

                    return response.text()
                        .then(function (texto) {
                            if (
                                !texto ||
                                !texto.trim()
                            ) {
                                return null;
                            }

                            try {
                                return JSON.parse(texto);
                            } catch (error) {
                                console.warn(
                                    'La respuesta no contiene JSON válido:',
                                    texto
                                );

                                return null;
                            }
                        });
                };

            window.obtenerOCrearSesionActivaKidzania =
                function () {
                    if (
                        window.kidzaniaSessionPromise
                    ) {
                        return window
                            .kidzaniaSessionPromise;
                    }

                    window.kidzaniaSessionPromise =
                        window
                            .buscarSesionActivaKidzania()
                            .then(
                                function (sesionActiva) {
                                    if (sesionActiva) {
                                        console.log(
                                            'Ya existe una sesión activa. ' +
                                            'Se reutilizará sin hacer POST.'
                                        );

                                        return sesionActiva;
                                    }

                                    console.log(
                                        'No existe sesión activa. ' +
                                        'Solicitando una nueva.'
                                    );

                                    return window
                                        .kidzaniaFetchConTimeout(
                                            window.KIDZANIA_API_URL +
                                                '/sessions',
                                            {
                                                method: 'POST',
                                                headers: {
                                                    'Accept':
                                                        'application/json',
                                                    'Content-Type':
                                                        'application/json'
                                                }
                                            },
                                            window.KIDZANIA_API_TIMEOUT_MS

            /*

            function esPlayerValido(player) {
                return (
                    player &&
                    typeof player.getComponentByName ===
                        'function'
                );
            }

            function resolverPlayer(candidato) {
                var player = null;

                /*
                 * Cuando la función es llamada desde
                 * Execute JavaScript de 3DVista,
                 * "this" normalmente es el player.
                 */
                if (esPlayerValido(candidato)) {
                    player = candidato;
                }

                /*
                 * Player almacenado anteriormente.
                 */
                if (
                    !player &&
                    esPlayerValido(window.tourPlayer)
                ) {
                    player = window.tourPlayer;
                }

                /*
                 * Forma común en proyectos publicados
                 * por 3DVista.
                 */
                if (
                    !player &&
                    window.tour &&
                    typeof window.tour._getRootPlayer ===
                        'function'
                ) {
                    try {
                        player =
                            window.tour._getRootPlayer();
                    } catch (error) {
                        console.warn(
                            'No se pudo obtener rootPlayer:',
                            error
                        );
                    }
                }

                /*
                 * Respaldo mediante tour.player.
                 */
                if (
                    !player &&
                    window.tour &&
                    window.tour.player &&
                    typeof window.tour.player.getById ===
                        'function'
                ) {
                    try {
                        player =
                            window.tour.player.getById(
                                'rootPlayer'
                            );
                    } catch (error) {
                        console.warn(
                            'No se pudo obtener rootPlayer por ID:',
                            error
                        );
                    }
                }

                /*
                 * Otros respaldos posibles.
                 */
                if (
                    !player &&
                    esPlayerValido(window.rootPlayer)
                ) {
                    player = window.rootPlayer;
                }

                if (
                    !player &&
                    esPlayerValido(window.player)
                ) {
                    player = window.player;
                }

                if (esPlayerValido(player)) {
                    window.tourPlayer = player;
                    return player;
                }

                return null;
            }

            /*
             * Espera a que 3DVista haya terminado de cargar.
             */
            function ejecutarConPlayer(
                candidato,
                alEncontrar,
                alFallar,
                intentos
            ) {
                var player =
                    resolverPlayer(candidato);

                intentos =
                    typeof intentos === 'number'
                        ? intentos
                        : 30;

                if (player) {
                    alEncontrar(player);
                    return;
                }

                if (intentos <= 0) {
                    console.error(
                        'No se pudo obtener el reproductor de 3DVista.'
                    );

                    if (
                        typeof alFallar === 'function'
                    ) {
                        alFallar();
                    }

                    return;
                }

                setTimeout(function () {
                    ejecutarConPlayer(
                        candidato,
                        alEncontrar,
                        alFallar,
                        intentos - 1
                    );
                }, 100);
            }

                 * Este es el fondo general que cubre el modelo.

                if (
                    nombre === 'back' &&
                    player
                        .Image_5368D668_43D6_E721_41A4_B79E13E595A4
                ) {
                    return player
                        .Image_5368D668_43D6_E721_41A4_B79E13E595A4;
                }

                try {
                    return player.getComponentByName(
                        nombre
                    );
                } catch (error) {
                    console.warn(
                        'No se pudo obtener el componente:',
                        nombre,
                        error

                    return null;

            function enfocarInputNombre() {
                if (!formularioNombreVisible()) {

                 */
                miInput.disabled = false;
                miInput.readOnly = false;
                miInput.setAttribute(

                    'false'

                        preventScroll: true
                    });

            function programarEnfoqueInput() {
                cancelarEnfoquesPendientes();

                [0, 80, 250, 600, 1200, 2500]
                    .forEach(
                        function (retraso) {
                            temporizadoresEnfoque.push(
                                setTimeout(
                                    enfocarInputNombre,
                                    retraso

            function limpiarEstadoProcesamiento() {

                nombreForm.removeAttribute(
                    'aria-busy'
                );

            function invalidarProcesamientoActual() {
                operacionEntradaActual += 1;
                limpiarEstadoProcesamiento();

            function finalizarProcesamiento(
                idOperacion
            ) {
                if (
                    idOperacion !==
                    operacionEntradaActual
                ) {
                    return false;

                limpiarEstadoProcesamiento();

            window.mostrarFormularioNombre =
                function (limpiarInput) {
                    clearTimeout(
                        temporizadorFormulario

                    var yaEstabaActivo =

                    formularioNombreActivo = true;

                    uiLayer.style.display =
                        'block';

                    uiLayer.style.visibility =
                        'visible';

                    uiLayer.style.pointerEvents =
                        'auto';

                    uiLayer.style.zIndex =
                        '2147483647';

                    /*
                     * Bienvenida puede solicitar el formulario más de una vez:
                     * desde el index y desde la acción Show de 3DVista. Si ya
                     * está activo, no vuelve a limpiar el texto ni cancela una

                     */
                    if (yaEstabaActivo) {
                        uiLayer.style.opacity =
                            '1';

                        programarEnfoqueInput();

                    }

                    /*
                     * Al volver realmente a Bienvenida se elimina cualquier

                     */
                    invalidarProcesamientoActual();

                    if (limpiarInput !== false) {
                        miInput.value = '';

                    uiLayer.style.opacity =

            window.validarNombreKidzania =
                function (nombreOriginal) {
                    var nombre =
                        String(nombreOriginal || '')
                            .trim()
                            .replace(/\s+/g, ' ');

                    if (!nombre) {
                        return {
                            valido: false,
                            mensaje:
                                'Ingresa tu nombre.'
                        };
                    }

                    if (/\d/.test(nombre)) {
                        return {
                            valido: false,
                            mensaje:
                                'El nombre no puede contener números.'
                        };
                    }

                    if (
                        /[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]/
                            .test(nombre)
                    ) {
                        return {
                            valido: false,
                            mensaje:
                                'El nombre solo puede contener letras y espacios. No uses símbolos.'
                        };
                    }

                    var cantidadLetras =
                        nombre.replace(/\s/g, '').length;

                    if (cantidadLetras < 3) {
                        return {
                            valido: false,
                            mensaje:
                                'El nombre debe contener al menos 3 letras.'
                        };
                    }

                    return {
                        valido: true,
                        nombre: nombre,
                        mensaje: ''
                    };

            /*
             * ======================================================
             * CONTINUAR DESDE BIENVENIDA
             * ======================================================
             *
             * La validación del nombre SI bloquea el avance.
             * La disponibilidad de la API NO bloquea el avance:

             */
            window.procesarNombreKidzania =
                function (candidatoPlayer, event) {
                    if (event) {
                        event.preventDefault();
                        event.stopPropagation();
                    }

                    if (procesandoEntrada) {
                        return false;
                    }

                    /*
                     * Los errores de nombre sí son stopper:
                     * vacío, números, símbolos o menos de 3 letras.
                     */
                    if (!window.guardarNombre()) {
                        return false;
                    }

                    procesandoEntrada = true;
                    nombreForm.setAttribute(
                        'aria-busy',
                        'true'
                    );

                    var idOperacion =
                        ++operacionEntradaActual;

                    /*
                     * Primero continúa la experiencia. No esperamos a la API.
                     */
                    ejecutarConPlayer(
                        candidatoPlayer || null,

                        function (player) {
                            if (
                                idOperacion !==
                                operacionEntradaActual
                            ) {
                                return;
                            }

                            window
                                .ocultarFormularioNombre();

                            window
                                .kidzaniaEntrarACategorias(
                                    player
                                );

                            finalizarProcesamiento(
                                idOperacion
                            );
                        },

                        function () {
                            if (
                                !finalizarProcesamiento(
                                    idOperacion
                                )
                            ) {
                                return;
                            }

                            window.alert(
                                'No se pudo abrir la pantalla de categorías. Vuelve a intentarlo.'
                            );

                            window
                                .mostrarFormularioNombre(
                                    false
                                );
                        }
                    );

                    /*
                     * La sesión se prepara en segundo plano.
                     * Si la API está caída, el interceptor global y este
                     * catch muestran el aviso, pero NO regresan a Bienvenida
                     * ni impiden seguir navegando.
                     */
                    if (
                        typeof window
                            .obtenerOCrearSesionActivaKidzania ===
                        'function'
                    ) {
                        window
                            .obtenerOCrearSesionActivaKidzania()
                            .then(function (sesion) {
                                console.log(
                                    'Sesión preparada en segundo plano:',
                                    sesion && sesion.id
                                );
                            })
                            .catch(function (error) {
                                console.error(
                                    'No se pudo preparar la sesión. ' +
                                    'La experiencia continuará sin conexión:',
                                    error
                                );

                                window.kidzaniaSessionPromise =
                                    null;

                                if (
                                    typeof window
                                        .mostrarAlertaConexionApi ===
                                    'function'
                                ) {
                                    window
                                        .mostrarAlertaConexionApi(
                                            'inicio'
                                        );
                                }
                            });
                    } else {
                        console.warn(
                            'No existe obtenerOCrearSesionActivaKidzania(). ' +
                            'La experiencia continuará sin sesión de API.'
                        );
                    }

                    return false;
                };

            /*
             * Enter físico. El submit de abajo cubre también Go/Done
             * de los teclados virtuales.
             */
            miInput.addEventListener(
                'keydown',
                function (event) {
                    event.stopPropagation();

                    if (
                        event.key !== 'Enter' ||
                        event.repeat
                    ) {
                        return;
                    }

                    window.procesarNombreKidzania(
                        null,
                        event
                    );
                }
            );

            nombreForm.addEventListener(
                'submit',
                function (event) {
                    window.procesarNombreKidzania(
                        null,
                        event
                    );
                }
            );

            /*
             * Evita que los eventos del formulario lleguen al visor.
             * No se usa preventDefault para conservar escritura, selección
             * y apertura del teclado virtual.
             */
            [
                'pointerdown',
                'pointerup',
                'mousedown',
                'mouseup',
                'touchstart',
                'touchend',
                'click',
                'dblclick',
                'keyup',
                'keypress'
            ].forEach(
                function (nombreEvento) {
                    nombreForm.addEventListener(
                        nombreEvento,
                        function (event) {
                            event.stopPropagation();
                        }
                    );
                }
            );

            /*
             * Un toque sobre cualquier parte del recuadro devuelve el foco
             * al campo, útil si 3DVista lo tomó durante una transición.
             */
            uiLayer.addEventListener(
                'pointerdown',
                function () {
                    setTimeout(
                        enfocarInputNombre,
                        0
                    );
                }
            );

            uiLayer.addEventListener(
                'touchend',
                function () {
                    setTimeout(
                        enfocarInputNombre,
                        0
                    );
                }
            );

            window.addEventListener(
                'focus',
                function () {
                    if (formularioNombreVisible()) {
                        programarEnfoqueInput();
                    }
                }
            );

            document.addEventListener(
                'visibilitychange',
                function () {
                    if (
                        document.visibilityState ===
                            'visible' &&
                        formularioNombreVisible()
                    ) {
                        programarEnfoqueInput();
                    }
                }
            );

            /*
             * Cuando termina el preloader de 3DVista, recupera el foco.
             */
            var preloadContainer =
                document.getElementById(
                    'preloadContainer'
                );

            if (
                preloadContainer &&
                typeof window.MutationObserver ===
                    'function'
            ) {
                observadorPreloader =
                    new window.MutationObserver(
                        function () {
                            if (
                                preloadContainer.style.display ===
                                    'none' ||
                                preloadContainer.style.visibility ===
                                    'hidden'
                            ) {
                                if (formularioNombreVisible()) {
                                    programarEnfoqueInput();
                                }
                            }
                        }
                    );

                observadorPreloader.observe(
                    preloadContainer,
                    {
                        attributes: true,
                        attributeFilter: [
                            'style'
                        ]
                    }
                );
            }

            /*
             * ======================================================
             * RESPALDO DE RETORNO A BIENVENIDA
             * ======================================================
             *
             * Algunas acciones de 3DVista vuelven a mostrar el
             * contenedor Bienvenida sin ejecutar correctamente su
             * JavaScript de evento Show. Este monitor detecta el
             * cambio de oculto a visible y recupera el formulario.
             */
            var monitorBienvenidaKidzania = null;
            var bienvenidaVisibleAnterior = null;

            function iniciarMonitorBienvenidaKidzania() {
                if (monitorBienvenidaKidzania) {
                    return;
                }

                monitorBienvenidaKidzania =
                    setInterval(
                        function () {
                            var player =
                                resolverPlayer(null);

                            if (!player) {
                                return;
                            }

                            var bienvenidaVisible =
                                leerVisibilidad(
                                    player,
                                    'Bienvenida'
                                ) === true;

                            /*
                             * Primera lectura: conserva el estado. El
                             * setTimeout inicial de abajo se encarga de
                             * mostrar el formulario al abrir la página.
                             */
                            if (
                                bienvenidaVisibleAnterior ===
                                null
                            ) {
                                bienvenidaVisibleAnterior =
                                    bienvenidaVisible;
                                return;
                            }

                            /*
                             * Se regresó desde Despedida a Bienvenida.
                             */
                            if (
                                bienvenidaVisible &&
                                bienvenidaVisibleAnterior ===
                                    false
                            ) {
                                window
                                    .mostrarFormularioNombre(
                                        true
                                    );
                            }

                            /*
                             * Si 3DVista cambia de pantalla por su
                             * cuenta, evita que el input quede encima.
                             */
                            if (
                                !bienvenidaVisible &&
                                bienvenidaVisibleAnterior ===
                                    true &&
                                formularioNombreActivo
                            ) {
                                window
                                    .ocultarFormularioNombre();
                            }

                            bienvenidaVisibleAnterior =
                                bienvenidaVisible;
                        },
                        200
                    );
            }

            iniciarMonitorBienvenidaKidzania();

            /*
             * Aparición inicial del formulario.
             */
            setTimeout(
                function () {
                    window
                        .mostrarFormularioNombre(
                            true
                        );
                },
                650
            );
        })();
    </script>
</body>
